services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yellow-flowers-web:local
    ports:
      - "${WEB_PORT:-3000}:80"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
